[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cavecode"
version = "0.0.1"
description = "cavecode"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7.0",
    "tree-sitter>=0.23.0",
]

[project.scripts]
cavecode = "cavecode.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cavecode*"]
exclude = ["do_not_upload*", "tests*", "benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["do_not_upload", ".*"]
