[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cavecode"
version = "1.0.0"
description = "CaveCode: AST-Aware High-Density Source-Code Compressor for AI Coding Agents"
readme = "README.md"
license = { text = "GNU Affero General Public License v3" }
authors = [
    { name = "CaveCode" }
]
keywords = [
    "ai", "context", "ast", "token-optimizer", "prompt-compression", "developer-tools"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7.0; extra != 'minimal'",
    "tree-sitter>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
cavecode = "cavecode.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cavecode*"]
exclude = ["do_not_upload*", "tests*", "benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["do_not_upload", ".*"]
