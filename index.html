<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaveCode</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --border: #1f2937;
      --accent: #38bdf8;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --code-bg: #030712;
      --green: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      min-height: 100vh;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .logo {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text);
    }
    .logo span { color: var(--accent); }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .mode-pills {
      display: flex;
      gap: 4px;
      background: var(--code-bg);
      padding: 4px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .mode-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: var(--accent);
      color: #030712;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
    }
    textarea {
      width: 100%;
      height: 440px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #e2e8f0;
      font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
      font-size: 0.85rem;
      padding: 12px;
      resize: vertical;
      line-height: 1.45;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    .copy-btn {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .copy-btn:hover { background: #334155; }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 16px 0;
    }
    @media (max-width: 600px) {
      .stats-bar { grid-template-columns: 1fr 1fr; }
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      text-align: center;
    }
    .stat-val {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      font-family: monospace;
    }
    .stat-val.reduction { color: var(--green); }
    .stat-lbl {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 4px;
    }
    footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">Cave<span>Code</span></div>
    </header>

    <div class="controls">
      <div class="mode-pills">
        <button class="mode-btn" onclick="setMode('lite')" id="btn-lite">Lite</button>
        <button class="mode-btn" onclick="setMode('medium')" id="btn-medium">Medium</button>
        <button class="mode-btn active" onclick="setMode('ultra')" id="btn-ultra">Ultra</button>
      </div>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="panel-header">
          <span id="rawMeta">~0 tokens</span>
        </div>
        <textarea id="inputCode" placeholder="Paste source code here..." oninput="processCode()"></textarea>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span id="outputTitle">Compressed (Ultra)</span>
          <button class="copy-btn" id="copyBtn" onclick="copyOutput()">Copy</button>
        </div>
        <textarea id="outputCode" readonly placeholder="Compressed code appears here..."></textarea>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-val" id="statRawTokens">~0</div>
        <div class="stat-lbl">Raw Tokens</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statCompTokens">~0</div>
        <div class="stat-lbl">Compressed Tokens</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statSavedTokens">~0</div>
        <div class="stat-lbl">Tokens Saved</div>
      </div>
      <div class="stat-card">
        <div class="stat-val reduction" id="statReduction">~0%</div>
        <div class="stat-lbl">Reduction</div>
      </div>
    </div>

    <footer>
      Licensed under GNU Affero General Public License v3
    </footer>
  </div>

  <script>
    let currentMode = 'ultra';
 
    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById('btn-' + mode);
      if (btn) btn.classList.add('active');
      document.getElementById('outputTitle').innerText = 'Compressed (' + mode.charAt(0).toUpperCase() + mode.slice(1) + ')';
      processCode();
    }

    function estimateTokens(text) {
      if (!text) return 0;
      return Math.round(text.length / 3.7);
    }

    function compressPython(code, mode) {
      let lines = code.split('\n');
      let out = [];

      if (mode === 'ultra') {
        let inFunc = false;
        let funcIndent = 0;
        let hasPass = false;

        for (let i = 0; i < lines.length; i++) {
          let line = lines[i];
          let trimmed = line.trim();

          if (!trimmed || trimmed.startsWith('#')) continue;
          if (trimmed.startsWith('"""') || trimmed.startsWith("'''")) {
            if (trimmed.endsWith('"""') && trimmed.length > 3) continue;
            if (trimmed.endsWith("'''") && trimmed.length > 3) continue;
            while (i + 1 < lines.length && !lines[i].includes('"""') && !lines[i].includes("'''")) {
              i++;
            }
            continue;
          }

          if (trimmed.startsWith('def ') || trimmed.startsWith('async def ')) {
            inFunc = true;
            hasPass = false;
            funcIndent = line.search(/\S/);
            out.push(line.replace(/def /, 'fn '));
            continue;
          }

          if (inFunc) {
            let currentIndent = line.search(/\S/);
            if (currentIndent <= funcIndent && trimmed.length > 0) {
              inFunc = false;
            } else {
              if (!hasPass) {
                out.push(' '.repeat(funcIndent + 4) + 'pass');
                hasPass = true;
              }
              continue;
            }
          }

          out.push(line);
        }
        return out.join('\n');
      }

      if (mode === 'medium') {
        for (let line of lines) {
          let trimmed = line.trim();
          if (!trimmed) continue;
          if (trimmed.startsWith('logger.') || trimmed.startsWith('print(')) continue;
          if (trimmed.startsWith('#')) {
            out.push('# ' + trimmed.replace(/^[#\s]+/, '').slice(0, 40));
            continue;
          }
          let mod = line.replace(/\bdef\b/g, 'fn').replace(/\breturn\b/g, 'ret');
          out.push(mod);
        }
        return out.join('\n');
      }

      for (let line of lines) {
        let trimmed = line.trim();
        if (!trimmed) continue;
        if (trimmed.startsWith('#')) {
          out.push('# ' + trimmed.replace(/^[#\s]+/, ''));
        } else {
          out.push(line);
        }
      }
      return out.join('\n');
    }

    function compressBrace(code, mode) {
      let lines = code.split('\n');
      let out = [];

      if (mode === 'ultra') {
        let inBlock = false;
        let blockDepth = 0;

        for (let line of lines) {
          let trimmed = line.trim();
          if (!trimmed || trimmed.startsWith('//') || trimmed.startsWith('/*') || trimmed.startsWith('*')) continue;

          let isSig = (
            (trimmed.includes('class ') || trimmed.includes('interface ') || trimmed.includes('struct ') || trimmed.includes('impl ')) ||
            ((trimmed.startsWith('pub ') || trimmed.startsWith('public ') || trimmed.startsWith('private ') || trimmed.startsWith('fn ') || trimmed.startsWith('function ') || trimmed.includes('): ')) && trimmed.includes('{'))
          );

          if (isSig && !inBlock && trimmed.includes('{') && !trimmed.endsWith('};')) {
            inBlock = true;
            blockDepth = 1;
            let sig = line.replace(/\{[^}]*$/, '').trim();
            out.push(sig + ' { ... }');
            continue;
          }

          if (inBlock) {
            for (let ch of line) {
              if (ch === '{') blockDepth++;
              if (ch === '}') blockDepth--;
            }
            if (blockDepth <= 0) inBlock = false;
            continue;
          }

          out.push(line);
        }
        return out.join('\n');
      }

      if (mode === 'medium') {
        for (let line of lines) {
          let trimmed = line.trim();
          if (!trimmed) continue;
          if (trimmed.startsWith('console.log') || trimmed.startsWith('logger.') || trimmed.startsWith('fmt.Println') || trimmed.startsWith('System.out.println')) continue;
          if (trimmed.startsWith('//')) {
            out.push('// ' + trimmed.replace(/^[\/\s]+/, '').slice(0, 40));
            continue;
          }
          let mod = line
            .replace(/\bpublic\b/g, 'pub')
            .replace(/\bprivate\b/g, 'priv')
            .replace(/\breturn\b/g, 'ret')
            .replace(/\bfunction\b/g, 'fn');
          out.push(mod);
        }
        return out.join('\n');
      }

      for (let line of lines) {
        let trimmed = line.trim();
        if (!trimmed) continue;
        out.push(line);
      }
      return out.join('\n');
    }

    function processCode() {
      let input = document.getElementById('inputCode').value;

      let compressed = '';
      if (input.trim()) {
        const isPython = input.includes('def ') || (input.includes('import ') && !input.includes(';'));
        if (isPython) {
          compressed = compressPython(input, currentMode);
        } else {
          compressed = compressBrace(input, currentMode);
        }
      }

      document.getElementById('outputCode').value = compressed;

      const rawTok = estimateTokens(input);
      const compTok = estimateTokens(compressed);
      const savedTok = Math.max(0, rawTok - compTok);
      const pct = rawTok > 0 ? ((savedTok / rawTok) * 100).toFixed(1) : 0;

      document.getElementById('rawMeta').innerText = '~' + rawTok.toLocaleString() + ' tokens';
      document.getElementById('statRawTokens').innerText = '~' + rawTok.toLocaleString();
      document.getElementById('statCompTokens').innerText = '~' + compTok.toLocaleString();
      document.getElementById('statSavedTokens').innerText = '~' + savedTok.toLocaleString();
      document.getElementById('statReduction').innerText = '~' + pct + '%';
    }

    function copyOutput() {
      const out = document.getElementById('outputCode');
      out.select();
      navigator.clipboard.writeText(out.value);
      const btn = document.getElementById('copyBtn');
      btn.innerText = 'Copied!';
      setTimeout(() => { btn.innerText = 'Copy'; }, 2000);
    }
  </script>
</body>
</html>
