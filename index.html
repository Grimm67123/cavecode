<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaveCode — Web Playground</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --border: #1f2937;
      --accent: #38bdf8;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --code-bg: #030712;
      --green: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      min-height: 100vh;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .logo { font-size: 1.3rem; font-weight: 800; color: var(--text); }
    .logo span { color: var(--accent); }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .mode-pills {
      display: flex;
      gap: 4px;
      background: var(--code-bg);
      padding: 4px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .mode-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active { background: var(--accent); color: #030712; }
    .lang-select {
      background: var(--code-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
    }
    textarea {
      width: 100%;
      height: 440px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #e2e8f0;
      font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
      font-size: 0.85rem;
      padding: 12px;
      resize: vertical;
      line-height: 1.45;
      outline: none;
      white-space: pre;
    }
    textarea:focus { border-color: var(--accent); }
    .copy-btn {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .copy-btn:hover { background: #334155; }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 16px 0;
    }
    @media (max-width: 600px) { .stats-bar { grid-template-columns: 1fr 1fr; } }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      text-align: center;
    }
    .stat-val {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      font-family: monospace;
    }
    .stat-val.reduction { color: var(--green); }
    .stat-lbl {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 4px;
    }
    footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">Cave<span>Code</span></div>
    </header>

    <div class="controls">
      <div class="mode-pills">
        <button class="mode-btn" onclick="setMode('lite')" id="btn-lite">Lite</button>
        <button class="mode-btn" onclick="setMode('medium')" id="btn-medium">Medium</button>
        <button class="mode-btn active" onclick="setMode('ultra')" id="btn-ultra">Ultra</button>
      </div>
      <select class="lang-select" id="langSelect" onchange="onLangChange()">
        <option value="auto">Auto-detect</option>
        <option value="python">Python (.py)</option>
        <option value="javascript">JavaScript (.js)</option>
        <option value="typescript">TypeScript (.ts)</option>
        <option value="go">Go (.go)</option>
        <option value="rust">Rust (.rs)</option>
        <option value="java">Java (.java)</option>
        <option value="cpp">C++ (.cpp)</option>
        <option value="csharp">C# (.cs)</option>
        <option value="c">C (.c)</option>
      </select>
    </div>


    <div class="grid">
      <div class="panel">
        <div class="panel-header">
          <span id="rawMeta">~0 tokens</span>
          <span id="detectedLang" style="opacity:.7"></span>
        </div>
        <textarea id="inputCode" placeholder="Paste source code here..." oninput="processCode()"></textarea>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span id="outputTitle">Compressed (Ultra)</span>
          <button class="copy-btn" id="copyBtn" onclick="copyOutput()">Copy</button>
        </div>
        <textarea id="outputCode" readonly placeholder="Compressed code appears here..."></textarea>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-val" id="statRawTokens">~0</div>
        <div class="stat-lbl">Raw Tokens</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statCompTokens">~0</div>
        <div class="stat-lbl">Compressed Tokens</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statSavedTokens">~0</div>
        <div class="stat-lbl">Tokens Saved</div>
      </div>
      <div class="stat-card">
        <div class="stat-val reduction" id="statReduction">~0%</div>
        <div class="stat-lbl">Reduction</div>
      </div>
    </div>


    <footer>
      Licensed under GNU Affero General Public License v3
    </footer>
  </div>

<script>
'use strict';

let currentMode = 'ultra';
let currentLangOverride = 'auto';

function normalizeMode(m) {
  if (!m) return 'medium';
  m = String(m).toLowerCase().trim();
  if (m === 'lite' || m === 'light') return 'lite';
  if (m === 'ultra') return 'ultra';
  return 'medium';
}

/* ---------- literal masking (for comment/brace scanning) ---------- */
function maskStrings(src) {
  // Mask "...", '...', `...`, """...""", '''...''' with placeholders
  const tokens = [];
  const re = /("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)/g;
  const masked = src.replace(re, (m) => {
    tokens.push(m);
    return '\u0000CAVE' + (tokens.length - 1) + '\u0000';
  });
  return { masked, tokens };
}
function unmaskStrings(src, tokens) {
  let out = src;
  for (let i = 0; i < tokens.length; i++) {
    out = out.split('\u0000CAVE' + i + '\u0000').join(tokens[i]);
  }
  return out;
}

/* ---------- telegraphic comments (base.py port) ---------- */
function telegraphicComment(text, prefix) {
  prefix = prefix === undefined ? '// ' : prefix;
  if (/copy\w*|licensed under|all rights reserved|general public license|mit license|apache license/i.test(text)) {
    const m = text.match(/copy\w*\s+(?:\(c\)\s*)?([0-9\-, ]+)?\s*([a-zA-Z0-9_\. ]+)/i);
    const owner = m ? m[0].trim() : 'Authors';
    return prefix + '[License: ' + owner + ']';
  }
  if (/#(?:region|endregion)\b/i.test(text)) return '';
  const mSect = text.match(/[-=*~]{4,}\s*([a-zA-Z0-9_ ]+)\s*[-=*~]{4,}/);
  if (mSect) return prefix + '[' + mSect[1].trim() + ']';
  if (/^\s*[-=*~#]{4,}\s*$/.test(text)) return '';
  text = text.replace(/\{@link\s+#?([^}]+)\}/g, '$1');
  text = text.replace(/\{@code\s+([^}]+)\}/g, '$1');
  text = text.replace(/<see\s+cref="([^"]+)"\s*\/>/g, '$1');
  text = text.replace(/<inheritdoc\s*\/?>/gi, '');
  text = text.replace(/<[^>]+>/g, ' ');
  text = text.replace(/\/\*+|\*+\/|^[ \t]*\*[ \t]?/gm, ' ');
  text = text.replace(/^[ \t]*#+[ \t]?/gm, ' ');
  text = text.replace(/^[ \t]*\/\/+[ \t]?/gm, ' ');
  text = text.replace(/\.\.\s*version(?:added|changed)::[^\n]+(?:\n\s+[^\n]+)*/g, '');
  text = text.replace(/@(?:since|author|version|see|return|param)[^\n]+/g, '');
  text = text.replace(/\.\.\s*code-block::[^\n]+(?:\n\s+[^\n]+)*/g, '');
  const lines = text.split('\n').map(l => l.trim()).filter(l => l);
  let content = lines.join(' ');
  if (!content || /^(?:inheritdoc|todo|fixme)\b/i.test(content)) return '';
  const sentences = content.split(/(?<=[.!?])\s+/);
  content = sentences.length ? sentences[0] : content;
  const subs = [
    [/\b(?:in order to|is used to|used to|responsible for|capable of|designed to)\b/gi, 'to'],
    [/\b(?:it is possible to|can be used to|allows you to)\b/gi, 'can'],
    [/\b(?:please note that|note that|it should be noted that)\b/gi, 'NOTE:'],
    [/\b(?:as well as|in addition to)\b/gi, '&'],
    [/\b(?:for example|such as|e\.g\.)\b/gi, 'eg'],
    [/\breturn(?:ing|s)?\b/gi, 'ret'],
    [/\bfunction(?:s)?\b/gi, 'fn'],
    [/\bstring(?:s)?\b/gi, 'str'],
    [/\bboolean\b/gi, 'bool'],
    [/\bmessage(?:s)?\b/gi, 'msg'],
    [/\bconfiguration\b/gi, 'config'],
    [/\b(?:the|a|an|is|are|was|were|to be|can be|will be|should be|would be|may be|must be|of|in|for|on|with|as|by|at|from|into)\b\s*/gi, ' ']
  ];
  for (const [p, r] of subs) content = content.replace(p, r);
  const words = content.split(/\s+/).map(w => w.trim()).filter(w => w);
  if (!words.length) return '';
  return prefix + words.slice(0, 12).join(' ');
}

function stripLicenseHeader(text) {
  return text.replace(/^(?:\/\*[\s\S]*?(?:copy\w*|license|all rights reserved)[\s\S]*?\*\/|\/\/[^\n]*(?:copy\w*|license)[^\n]*\r?\n+|#[^\n]*(?:copy\w*|license)[^\n]*\r?\n+|"""[\s\S]*?(?:copy\w*|license)[\s\S]*?""")/i, '');
}

function processPythonComments(code, mode) {
  const m = normalizeMode(mode);
  code = stripLicenseHeader(code);
  if (m === 'ultra') {
    code = code.replace(/"""[\s\S]*?"""|'''[\s\S]*?'''/g, '');
    code = code.replace(/^[ \t]*#[^\n]*\r?\n/gm, '');
    code = code.replace(/(?<!:)#[^\n]*/g, '');
    return code;
  }
  code = code.replace(/("""|''')([\s\S]*?)\1/g, (full, q, inner) => {
    const t = telegraphicComment(inner, '');
    return t ? q + t + q : '""';
  });
  code = code.replace(/(?:^[ \t]*#[^\n]*\r?\n)+/gm, (blk) => {
    const t = telegraphicComment(blk, '# ');
    return t ? t + '\n' : '';
  });
  return code;
}

function processCComments(code, mode) {
  const m = normalizeMode(mode);
  code = stripLicenseHeader(code);
  if (m === 'ultra') {
    // string-aware: mask then strip
    const { masked, tokens } = maskStrings(code);
    let out = masked.replace(/\/\*[\s\S]*?\*\//g, '');
    out = out.replace(/(?<!:)\/\/[^\n]*/g, '');
    return unmaskStrings(out, tokens);
  }
  code = code.replace(/\/\*([\s\S]*?)\*\//g, (full, inner) => {
    const t = telegraphicComment(inner, '');
    return t ? '/* ' + t + ' */' : '';
  });
  code = code.replace(/(?:^[ \t]*\/\/[^\n]*\r?\n)+/gm, (blk) => {
    const t = telegraphicComment(blk, '// ');
    return t ? t + '\n' : '';
  });
  return code;
}

function condenseStringLiterals(code, mode) {
  const m = normalizeMode(mode);
  if (m === 'lite') return code;
  const threshold = m === 'ultra' ? 16 : 28;
  const cutoff = m === 'ultra' ? 10 : 20;
  function trunc(full, quote, inner) {
    if (inner.length > threshold && !inner.startsWith('http') && !inner.startsWith('data:')) {
      return quote + inner.slice(0, cutoff).trim() + '...' + quote;
    }
    return full;
  }
  code = code.replace(/"([^"\n]*)"/g, (full, inner) => trunc(full, '"', inner));
  code = code.replace(/'([^'\n]*)'/g, (full, inner) => trunc(full, "'", inner));
  return code;
}

/* Combined strip: base.py regexes + ast_pruner AST patterns (console.debug etc) */
function stripVerboseLogging(code, mode) {
  const m = normalizeMode(mode);
  if (m === 'lite') return code;
  const pats = [
    /^[ \t]*logger\.(?:V\(\d+\)\.|debug|trace|info)\(.*\);?[ \t]*\r?\n?/gm,
    /^[ \t]*klog\.(?:V\(\d+\)\.|debug|trace|info)\(.*\);?[ \t]*\r?\n?/gm,
    /^[ \t]*_?logger\.Log(?:Debug|Trace)\(.*\);?[ \t]*\r?\n?/gm,
    /^[ \t]*debugLogger\.log\(.*\);?[ \t]*\r?\n?/gm,
    /^[ \t]*serverLog\(LL_DEBUG.*\);?[ \t]*\r?\n?/gm,
    /^[ \t]*(?:DEBUGASSERT|assert|DEBUGF|CURL_TRC)\(.*\);?[ \t]*\r?\n?/gm,
    // AST-level (ast_pruner.py): console.debug/trace, debug!/trace!, serverAssert etc
    /^[ \t]*console\.(?:debug|trace)\(.*\);?[ \t]*\r?\n?/gm,
    /^[ \t]*serverAssert\(.*\);?[ \t]*\r?\n?/gm,
    /^[ \t]*serverLog\(LL_DEBUG.*$/gm,
    /^[ \t]*(?:debug!|trace!)[^\n]*\r?\n?/gm
  ];
  for (const p of pats) code = code.replace(p, '');
  // Python-style without semicolons (same semantics as CLI medium)
  code = code.replace(/^[ \t]*logger\.(?:debug|trace|info)\(.*\)[ \t]*\r?\n?/gm, '');
  return code;
}

function inlineSmallBlocks(text, mode) {
  const m = normalizeMode(mode);
  if (m === 'lite') return text;
  function inlineCb(full, body) {
    const lines = body.split('\n').map(l => l.trim()).filter(l => l);
    const maxLines = m === 'ultra' ? 4 : 3;
    const maxLen = m === 'ultra' ? 180 : 140;
    if (!(lines.length >= 1 && lines.length <= maxLines && lines.join('').length + lines.length * 2 <= maxLen + 20)) {
      // precise check like CLI
      let total = 0;
      for (const l of lines) total += l.length;
      if (!(lines.length >= 1 && lines.length <= maxLines && total <= maxLen)) return full;
    }
    if (lines.some(l => l.startsWith('//') || l.startsWith('/*'))) return full;
    const isObj = lines.some(l => l.endsWith(',')) || lines.every(l => l.includes(':'));
    if (isObj) {
      const cleaned = lines.map(l => l.replace(/[,;]+$/, ''));
      return '{ ' + cleaned.join(', ') + ' }';
    }
    const res = [];
    for (let i = 0; i < lines.length; i++) {
      let clean = lines[i].replace(/;+$/, '');
      if (i > 0 && (/^(\?|:|&&|\|\||\+|\.|=>|\)|\])/.test(clean) || /(\?|:|&&|\|\||\+|-|\*|\/|=|=>|\(|\[)$/.test(res[res.length-1]))) {
        res[res.length-1] = res[res.length-1] + ' ' + clean;
      } else res.push(clean);
    }
    return '{ ' + res.join('; ') + ' }';
  }
  for (let k = 0; k < 3; k++) {
    text = text.replace(/\{\s*\n([^{}]+?)\n\s*\}/g, inlineCb);
  }
  return text;
}

function stripSemicolons(text) {
  return text.replace(/;[ \t]*$/gm, '');
}

function normalizeIndentation(text) {
  const lines = [];
  for (const line of text.split('\n')) {
    const stripped = line.trim();
    if (!stripped) continue;
    const expanded = line.replace(/\t/g, '    ');
    const m = expanded.match(/^ */);
    const origIndent = m ? m[0].length : 0;
    let level = 0;
    if (origIndent >= 4) level = Math.floor(origIndent / 4);
    else if (origIndent >= 2) level = 1;
    lines.push('  '.repeat(level) + stripped);
  }
  return lines.join('\n');
}

/* ---------- ultra body stubbing (heuristic port of ast_pruner ultra) ---------- */
function stubPythonBodies(code) {
  // collapse multiline defs first (same regex as python.py)
  code = code.replace(/(?:async\s+)?(?:def|fn)\s+[a-zA-Z0-9_]+\s*\([^:]*?\)\s*(?:->[^:]+?)?:/g, (mt) => mt.replace(/\s*\n\s*/g, ' '));
  const lines = code.split('\n');
  const out = [];
  let inFunc = false, funcIndent = 0, hasPass = false;
  const defRe = /^(?:async\s+)?def\s+[a-zA-Z0-9_]+\s*\(.*\)\s*(?:->.*)?:\s*(?:#[^\n]*)?$/;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const trimmed = line.trim();
    if (!trimmed) continue;
    const ind = line.replace(/\t/g, '    ').match(/^ */)[0].length;
    if (defRe.test(trimmed)) {
      inFunc = true; funcIndent = ind; hasPass = false;
      out.push(line);
      continue;
    }
    if (inFunc) {
      if (ind <= funcIndent) {
        inFunc = false;
        // fall through to normal handling
      } else {
        if (!hasPass) { out.push('  pass'); hasPass = true; }
        continue;
      }
    }
    out.push(line);
  }
  return out.join('\n');
}

function isBraceFunctionSignature(trimmed) {
  if (!trimmed) return false;
  if (/^(class|struct|interface|enum|namespace|typedef|if|for|while|switch|catch|try|else|do|return|import|package|using)\b/.test(trimmed)) return false;
  if (!trimmed.includes('(') || !trimmed.includes(')')) return false;
  // must look like fn decl (has brace or arrow or colon-type + brace on next line handled by caller)
  if (/\b(fn|func|function|constructor)\b/.test(trimmed)) return true;
  if (/\basync\s+[A-Za-z0-9_]+\s*\(/.test(trimmed)) return true;
  if (/=>/.test(trimmed) && trimmed.includes('{')) return true;
  // Generic Type name(...) [throws/const] {?  — Java/C#/C++/Go/Rust style
  if (/^[\w<>\[\]\*&:,.?\s]+\s+\w+\s*\([^;{}]*\)\s*(throws\s+[\w,\s]+)?\s*(const\s*)?(noexcept\s*)?\{?\s*$/.test(trimmed)) {
    if (/^\s*(if|while|for|switch|catch)\b/.test(trimmed)) return false;
    return true;
  }
  if (/^\s*fn\s+/.test(trimmed) || /^\s*func\s+/.test(trimmed)) return true;
  if (/\)\s*:\s*[\w<>\[\]\?|&,\s]+\s*\{?\s*$/.test(trimmed)) return true; // TS return type
  return false;
}

function stubBraceBodies(code) {
  const lines = code.split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    const trimmed = line.trim();
    const nextTrimmed = i + 1 < lines.length ? lines[i+1].trim() : '';
    const sigHere = trimmed.includes('{') && isBraceFunctionSignature(trimmed);
    const sigNext = !trimmed.includes('{') && nextTrimmed === '{' && isBraceFunctionSignature(trimmed);
    if ((sigHere || sigNext) && normalizeMode(currentMode) === 'ultra') {
      // find opening brace line
      let braceLineIdx = sigHere ? i : i + 1;
      // output collapsed signature
      let sig = sigHere ? line.slice(0, line.indexOf('{')).trimEnd() : line.trimEnd();
      // collapse internal newlines already single line here; keep indent
      const indent = line.match(/^ */)[0];
      out.push(indent + sig.replace(/^\s+/, '').replace(/\s+/g, (s) => s.includes('\n') ? ' ' : s) + ' { ... }');
      // skip body via depth counting on masked text
      let depth = 0;
      let started = false;
      let j = braceLineIdx;
      // build masked joined tail for counting
      for (; j < lines.length; j++) {
        const { masked } = maskStrings(lines[j]);
        // strip // comments on masked (strings already masked)
        const noComm = masked.replace(/\/\/[^\n]*/g, '');
        for (const ch of noComm) {
          if (ch === '{') { depth++; started = true; }
          if (ch === '}') depth--;
        }
        if (started && depth <= 0) { j++; break; }
      }
      i = j;
      continue;
    }
    out.push(line);
    i++;
  }
  return out.join('\n');
}

/* collapse multiline call args / params (ast_pruner fallback, all modes where applicable) */
function collapseParamLists(code, mode) {
  const m = normalizeMode(mode);
  // (\n a, \n b) -> (a, b) for short lists
  code = code.replace(/\(\s*\n([^()]{1,220}?)\n\s*\)/g, (full, inner) => {
    if (inner.includes('{') || inner.includes('=>') || inner.includes('lambda')) return full;
    const parts = inner.split(',').map(s => s.trim().replace(/\s+/g, ' ')).filter(s => s);
    if (parts.length >= 1 && full.length < 260) return '(' + parts.join(', ') + ')';
    return full;
  });
  return code;
}

/* ---------- per-language compressors (same order as CLI) ---------- */
function compressPython(code, mode) {
  const m = normalizeMode(mode);
  if (!code.trim()) return code;
  if (m === 'ultra') {
    code = processPythonComments(code, 'ultra');
    code = stubPythonBodies(code);
  } else {
    code = processPythonComments(code, m);
  }
  code = condenseStringLiterals(code, m);
  code = stripVerboseLogging(code, m);
  if (m === 'ultra') {
    code = code.replace(/^[ \t]*if\s+TYPE_CHECKING:[\s\S]*?(?=^[a-zA-Z0-9_#])/gm, '');
    code = code.replace(/\bself\./g, '');
  }
  code = code.replace(/(?:async\s+)?(?:def|fn)\s+[a-zA-Z0-9_]+\s*\([^:]*?\)\s*(?:->[^:]+?)?:/g, (mt) => mt.replace(/\s*\n\s*/g, ' '));
  code = code.replace(/^([ \t]*)if\s+([^\n:]+):\s*\n[ \t]+(return\b[^\n]+|raise\b[^\n]+)/gm, '$1if $2: $3');
  code = code.replace(/from\s+([a-zA-Z0-9_\.]+)\s+import\s*\(([^)]+)\)/g, (full, mod, inner) => {
    const parts = inner.split(/[\s,]+/).map(x => x.trim().replace(/,+$/, '')).filter(x => x);
    return 'from ' + mod + ' import ' + parts.join(', ');
  });
  code = code.replace(/[ \t]*#\s*(?:type:\s*ignore(?:\[[^\]]*\])?|noqa:[^\n]+|noqa\b)/g, '');
  code = code.replace(/\(\s*\n([^()]+?)\n\s*\)/g, (full, inner) => {
    const lns = inner.split('\n').map(l => l.trim().replace(/,+$/, '')).filter(l => l && !l.startsWith('#'));
    if (lns.length >= 2 && lns.length <= 8 && lns.join('').length <= 180) return '(' + lns.join(', ') + ')';
    return full;
  });
  code = code.replace(/(?:^[ \t]*import\s+[a-zA-Z0-9_\.]+\s*\r?\n){2,}/gm, (blk) => {
    const lns = blk.split('\n').map(l => l.trim()).filter(l => l);
    const mods = lns.filter(l => l.startsWith('import ')).map(l => l.slice(7).trim());
    return mods.length >= 2 ? 'import ' + mods.join(', ') + '\n' : blk;
  });
  code = code.replace(/\b(?:typing\.)?Optional\[([a-zA-Z0-9_\[\],\s]+)\]/g, '$1?');
  code = code.replace(/\b(?:typing\.)?Union\[([a-zA-Z0-9_]+),\s*([a-zA-Z0-9_]+)\]/g, '$1 | $2');
  code = code.replace(/\btyping\.List\b/g, 'list').replace(/\btyping\.Dict\b/g, 'dict').replace(/\btyping\.Set\b/g, 'set').replace(/\btyping\.Tuple\b/g, 'tuple').replace(/\btyping\.Any\b/g, 'any');
  code = code.replace(/\breturn\b/g, 'ret').replace(/\bdef\b/g, 'fn');
  code = code.replace(/if\s+__name__\s*==\s*['"]__main__['"]\s*:/g, 'if __main__:');
  code = code.replace(/([:\n]\s*"""[\s\S]*?"""\s*)\n\s*pass\b/g, '$1');
  return normalizeIndentation(code);
}

function compressJavaScript(code, lang, mode) {
  const m = normalizeMode(mode);
  if (!code.trim()) return code;
  if (m === 'ultra') {
    code = processCComments(code, 'ultra');
    // stub AFTER comment strip (heuristic port of tree-sitter prune)
    const saved = currentMode; currentMode = 'ultra';
    code = stubBraceBodies(code);
    currentMode = saved;
  } else {
    code = processCComments(code, m);
  }
  code = condenseStringLiterals(code, m);
  code = stripVerboseLogging(code, m);
  code = code.replace(/import\s+(?:type\s+)?\{([\s\S]*?)\}\s*from\s*['"]([^'"]+)['"]\s*;?/g, (full, items, mod) => {
    const isType = /type\s+/.test(full.split('{')[0]) ? 'type ' : '';
    const arr = items.split(',').map(x => x.trim()).filter(x => x);
    return 'import ' + isType + '{ ' + arr.join(', ') + " } from '" + mod + "';";
  });
  code = code.replace(/export\s*\{([\s\S]*?)\}\s*;/g, (full, items) => {
    const arr = items.split(',').map(x => x.trim()).filter(x => x);
    return 'export { ' + arr.join(', ') + ' };';
  });
  if (lang === 'typescript' || lang === 'ts') {
    code = code.replace(/\b([a-zA-Z0-9_.]+)\s*\|\s*(?:undefined|null)\b/g, '$1?');
    code = code.replace(/\b(?:undefined|null)\s*\|\s*([a-zA-Z0-9_.]+)\b/g, '$1?');
    code = code.replace(/\breadonly\b/g, 'ro');
    code = code.replace(/:\s*string\b/g, ': str').replace(/:\s*number\b/g, ': num');
    code = code.replace(/<string>/g, '<str>').replace(/<number>/g, '<num>');
    code = code.replace(/\bPromise<string>\b/g, 'Promise<str>').replace(/\bPromise<boolean>\b/g, 'Promise<bool>');
    code = code.replace(/((?:exp\s+)?(?:interface|type)\s+[^{]+?)\{\s*\n([^{}]+?)\n\s*\}/g, (full, header, body) => {
      const lns = body.split('\n').map(l => l.trim().replace(/;$/, '')).filter(l => l);
      if (lns.length <= 6 && lns.join('').length <= 180 && !lns.some(l => l.startsWith('//'))) return header + '{ ' + lns.join('; ') + ' }';
      return full;
    });
  }
  code = code.replace(/\breturn\b/g, 'ret').replace(/\bthis\./g, '').replace(/\bfunction\b/g, 'fn');
  code = code.replace(/\bexport\s+default\s+function\b/g, 'exp def fn').replace(/\bexport\s+default\b/g, 'exp def').replace(/\bexport\b/g, 'exp');
  code = code.replace(/\bpublic\b/g, 'pub').replace(/\bprivate\b/g, 'priv').replace(/\bprotected\b/g, 'prot').replace(/\bboolean\b/g, 'bool');
  code = code.replace(/^[ \t]*(?:static\s+|pub\s+|priv\s+|prot\s+|ro\s+|fn\s+|func\s+|async\s+)*[a-zA-Z0-9_*&<>, ]+\s+(?!(?:if|while|for|switch|catch|return|ret)\b)[a-zA-Z0-9_]+\s*\([^)]*?\)\s*(?::\s*[^;{]+)?\s*\{/gm, (mt) => mt.replace(/\s*\n\s*/g, ' '));
  code = stripSemicolons(code);
  code = inlineSmallBlocks(code, m);
  code = code.replace(/(?:^[ \t]*import\s+[^;\n]+;?\s*\r?\n){2,}/gm, (blk) => {
    const lns = blk.split('\n').map(l => l.trim().replace(/;$/, '')).filter(l => l);
    return lns.join('; ') + ';\n';
  });
  code = collapseParamLists(code, m);
  return normalizeIndentation(code);
}

function compressGo(code, mode) {
  const m = normalizeMode(mode);
  if (!code.trim()) return code;
  if (m === 'ultra') {
    code = processCComments(code, 'ultra');
    const s = currentMode; currentMode = 'ultra'; code = stubBraceBodies(code); currentMode = s;
  } else code = processCComments(code, m);
  code = condenseStringLiterals(code, m);
  code = stripVerboseLogging(code, m);
  code = code.replace(/\bfunc\b/g, 'fn').replace(/\breturn\b/g, 'ret').replace(/\binterface\{\}/g, 'any');
  code = code.replace(/^[ \t]*fn\s+(?:\([^)]+\)\s+)?[a-zA-Z0-9_]+\s*\([^)]*?\)\s*(?:\([^)]*?\)|[a-zA-Z0-9_*&<>, ]+)?\s*\{/gm, (mt) => mt.replace(/\s*\n\s*/g, ' '));
  code = code.replace(/^[ \t]*if\s+err\s*!=\s*nil\s*\{\s*\r?\n[ \t]*ret(?:urn)?\s*([^;\n]*?)\s*\r?\n[ \t]*\}/gm, (full, a) => ('if err != nil { ret ' + a.trim() + ' }').replace('ret  }', 'ret }'));
  code = code.replace(/^[ \t]*if\s+err\s*!=\s*nil\s*\{\s*\r?\n[ \t]*([^\n]+?)\s*\r?\n[ \t]*ret(?:urn)?\s*([^;\n]*?)\s*\r?\n[ \t]*\}/gm, (full, a, b) => ('if err != nil { ' + a.trim() + '; ret ' + b.trim() + ' }'));
  code = code.replace(/import\s*\(\s*\n([^)]+?)\n\s*\)/g, (full, inner) => {
    const pkgs = [...inner.matchAll(/"([^"]+)"/g)].map(x => '"' + x[1] + '"');
    return pkgs.length >= 2 ? 'import (' + pkgs.join(' ') + ')\n' : full;
  });
  code = inlineSmallBlocks(code, m);
  code = collapseParamLists(code, m);
  return normalizeIndentation(code);
}

function compressRust(code, mode) {
  const m = normalizeMode(mode);
  if (!code.trim()) return code;
  if (m === 'ultra') {
    code = processCComments(code, 'ultra');
    const s = currentMode; currentMode = 'ultra'; code = stubBraceBodies(code); currentMode = s;
  } else code = processCComments(code, m);
  code = condenseStringLiterals(code, m);
  code = stripVerboseLogging(code, m);
  code = code.replace(/#\[inline[^\]]*\]\s*/g, '').replace(/#\[doc\(hidden[^\]]*\)\]\s*/g, '').replace(/#\[must_use[^\]]*\]\s*/g, '').replace(/#\[rustc_[^\]]*\]\s*/g, '');
  code = code.replace(/#\[derive\(([^)]+)\)\]/g, (full, inner) => '#[derive(' + inner.split(',').map(x => x.trim()).join(',') + ')]');
  code = code.replace(/match\s+([a-zA-Z0-9_.]+)\s*\{\s*Ok\((\w+)\)\s*=>\s*\2,\s*Err\(\w+\)\s*=>\s*return\s+Err\([^)]+\),?\s*\}/g, '$1?');
  code = code.replace(/\bpub\(crate\)\b/g, 'pub').replace(/\breturn\b/g, 'ret');
  code = inlineSmallBlocks(code, m);
  code = collapseParamLists(code, m);
  return normalizeIndentation(code);
}

function compressJava(code, mode) {
  const m = normalizeMode(mode);
  if (!code.trim()) return code;
  if (m === 'ultra') {
    code = processCComments(code, 'ultra');
    const s = currentMode; currentMode = 'ultra'; code = stubBraceBodies(code); currentMode = s;
  } else code = processCComments(code, m);
  code = condenseStringLiterals(code, m);
  code = stripVerboseLogging(code, m);
  code = code.replace(/@SuppressWarnings\([^)]*\)\s*/g, '').replace(/@Generated\([^)]*\)\s*/g, '').replace(/@Override\s*/g, '').replace(/@Nullable\s*/g, '?');
  code = code.replace(/\bpublic\s+static\s+final\b/g, 'const').replace(/\bprivate\s+static\s+final\b/g, 'priv const');
  code = code.replace(/\bpublic\s+static\b/g, 'pub static').replace(/\bprivate\s+static\b/g, 'priv static');
  code = code.replace(/\bpublic\b/g, 'pub').replace(/\bprivate\b/g, 'priv').replace(/\bprotected\b/g, 'prot').replace(/\bboolean\b/g, 'bool').replace(/\breturn\b/g, 'ret').replace(/\bthis\./g, '');
  code = code.replace(/new\s+([A-Z]\w*)<[^>]+>\s*\(/g, 'new $1<>(');
  code = code.replace(/(?:^[ \t]*import\s+[^;\n]+;\s*\r?\n){2,}/gm, (blk) => {
    const lns = blk.split('\n').map(l => l.trim().replace(/;$/, '')).filter(l => l);
    return lns.join('; ') + ';\n';
  });
  code = code.replace(/(?:static\s+|pub\s+|priv\s+|prot\s+|final\s+|volatile\s+|synchronized\s+)*[a-zA-Z0-9_*&<>, \[\]?]+\s+[a-zA-Z0-9_]+\s*\([^)]*?\)\s*(?:throws\s+[a-zA-Z0-9_, ]+)?\s*\{/g, (mt) => mt.replace(/\s*\n\s*/g, ' '));
  code = stripSemicolons(code);
  code = inlineSmallBlocks(code, m);
  code = collapseParamLists(code, m);
  return normalizeIndentation(code);
}

function compressCpp(code, lang, mode) {
  const m = normalizeMode(mode);
  if (!code.trim()) return code;
  if (m === 'ultra') {
    code = processCComments(code, 'ultra');
    const s = currentMode; currentMode = 'ultra'; code = stubBraceBodies(code); currentMode = s;
  } else code = processCComments(code, m);
  code = condenseStringLiterals(code, m);
  code = stripVerboseLogging(code, m);
  code = code.replace(/#ifndef\s+([A-Za-z0-9_]+)\s*\r?\n#define\s+\1/, '/* [guard $1] */ #pragma once');
  code = code.replace(/(?:^[ \t]*#include\s+[<"][^>"\n]+[>"]\s*\r?\n(?:[ \t]*\r?\n)?)+/gm, (blk) => {
    const ang = [...blk.matchAll(/#include\s+<([^>]+)>/g)].map(x => x[1]);
    const quo = [...blk.matchAll(/#include\s+"([^"]+)"/g)].map(x => x[1]);
    const all = ang.concat(quo);
    return all.length >= 2 ? '#include <' + all.join(', ') + '>\n' : blk;
  });
  code = code.replace(/\breturn\b/g, 'ret');
  code = code.replace(/\bunsigned\s+int\b/g, 'u32').replace(/\bunsigned\s+long\s+long\b/g, 'u64').replace(/\bunsigned\s+long\b/g, 'u64').replace(/\bunsigned\s+char\b/g, 'u8');
  code = code.replace(/\buint32_t\b/g, 'u32').replace(/\buint64_t\b/g, 'u64').replace(/\buint8_t\b/g, 'u8').replace(/\bint32_t\b/g, 'i32').replace(/\bint64_t\b/g, 'i64');
  code = code.replace(/\bsize_t\b/g, 'usize').replace(/\bssize_t\b/g, 'isize');
  code = code.replace(/\bNULL\b/g, '0').replace(/\bnullptr\b/g, '0').replace(/\bTRUE\b/g, '1').replace(/\bFALSE\b/g, '0');
  code = code.replace(/__attribute__\s*\(\([^)]*\)\)/g, '').replace(/__declspec\s*\([^)]*\)/g, '');
  if (lang === 'cpp') {
    code = code.replace(/\bstd::(vector|string|map|unordered_map|set|unordered_set|unique_ptr|shared_ptr|make_unique|make_shared|pair|tuple|optional|variant|cout|cin|cerr|endl)\b/g, '$1');
    code = code.replace(/namespace\s+(\w+)\s*\{\s*\n\s*namespace\s+(\w+)\s*\{/g, 'namespace $1::$2 {');
    code = code.replace(/\bconst\s+auto&/g, 'auto&');
  }
  code = code.replace(/^[ \t]*(?:static\s+|inline\s+|virtual\s+|explicit\s+|constexpr\s+|friend\s+)*(?:[a-zA-Z0-9_*&<>,]+\s+)+(?!(?:if|while|for|switch|catch|return|ret)\b)[a-zA-Z0-9_:]+\s*\([^;{]*?\)\s*(?:const\s*)?(?:noexcept\s*)?\{/gm, (mt) => mt.replace(/\s*\n\s*/g, ' '));
  code = code.replace(/\bstruct\s+([A-Za-z0-9_]+)\b/g, '$1');
  code = inlineSmallBlocks(code, m);
  code = collapseParamLists(code, m);
  return normalizeIndentation(code);
}

function compressCSharp(code, mode) {
  const m = normalizeMode(mode);
  if (!code.trim()) return code;
  if (m === 'ultra') {
    code = processCComments(code, 'ultra');
    const s = currentMode; currentMode = 'ultra'; code = stubBraceBodies(code); currentMode = s;
  } else code = processCComments(code, m);
  code = condenseStringLiterals(code, m);
  code = stripVerboseLogging(code, m);
  code = code.replace(/\bpublic\s+static\s+readonly\b/g, 'const').replace(/\bprivate\s+static\s+readonly\b/g, 'priv const');
  code = code.replace(/\bpublic\s+static\b/g, 'pub static').replace(/\bprivate\s+static\b/g, 'priv static');
  code = code.replace(/\bpublic\b/g, 'pub').replace(/\bprivate\b/g, 'priv').replace(/\bprotected\b/g, 'prot').replace(/\binternal\b/g, 'intnl').replace(/\breadonly\b/g, 'ro').replace(/\bboolean\b/g, 'bool').replace(/\breturn\b/g, 'ret').replace(/\bthis\./g, '');
  code = code.replace(/\{\s*get\s*\{[^}]*?ret(?:urn)?\s+([^;]+?);\s*\}\s*set\s*\{[^}]*?\}\s*\}/g, '{ get => $1; set; }');
  code = code.replace(/\{\s*get\s*\{[^}]*?ret(?:urn)?\s+([^;]+?);\s*\}\s*\}/g, '{ get => $1; }');
  code = code.replace(/\{\s*get;\s*set;\s*\}/g, '{get;set;}');
  code = code.replace(/=>\s*\n\s*/g, '=> ');
  code = code.replace(/(?:pub\s+|priv\s+|prot\s+|intnl\s+|static\s+|async\s+|virtual\s+|override\s+|sealed\s+)*[a-zA-Z0-9_*&<>, \[\]?]+\s+[a-zA-Z0-9_]+\s*\([^)]*?\)\s*\{/g, (mt) => mt.replace(/\s*\n\s*/g, ' '));
  code = code.replace(/(?:^[ \t]*using\s+[^;\n]+;\s*\r?\n(?:[ \t]*\r?\n)?)+/gm, (blk) => {
    const ns = [...blk.matchAll(/using\s+([^;\n]+);/g)].map(x => x[1].trim());
    return ns.length >= 2 ? 'using ' + ns.join('; ') + ';\n' : blk;
  });
  code = stripSemicolons(code);
  code = inlineSmallBlocks(code, m);
  code = collapseParamLists(code, m);
  return normalizeIndentation(code);
}

/* ---------- language detection ---------- */
function detectLanguage(code) {
  if (currentLangOverride && currentLangOverride !== 'auto') return currentLangOverride;
  const t = code;
  if (/^\s*package\s+\w+/m.test(t) && /\bfunc\b/.test(t)) return 'go';
  if (/#include\s*[<"]/.test(t)) {
    if (/\b(class|std::|cout|template|namespace)\b/.test(t)) return 'cpp';
    return 'c';
  }
  if (/using\s+System/.test(t) && /\bnamespace\b/.test(t)) return 'csharp';
  if (/\bpublic\s+class\b/.test(t) && /import\s+java/.test(t)) return 'java';
  if (/\bpublic\s+class\b/.test(t) && /System\.out|void\s+\w+\s*\(/.test(t)) {
    return /using\s+System|namespace\s+\w+/.test(t) ? 'csharp' : 'java';
  }
  if (/^\s*(use\s+\w+::|fn\s+\w+\s*\(|impl\s+\w+|#\[derive)/m.test(t)) return 'rust';
  if (/:\s*(string|number|boolean|Observable|Promise<)|interface\s+\w+\s*\{|type\s+\w+\s*=/.test(t)) return 'typescript';
  if (/(def\s+\w+\s*\(|:\s*->|import\s+os|from\s+\w+\s+import\s+)/.test(t) && !/;/.test(t.split('\n')[0] || '')) {
    if (/^\s*(def\s+|async\s+def\s+|import\s+\w+|from\s+\w+)/m.test(t)) return 'python';
  }
  if (/\b(function|=>|console\.|require\(|import\s+.*from\s+['"])/.test(t)) return 'javascript';
  if (/^\s*def\s+/m.test(t)) return 'python';
  return 'javascript';
}

function compressDispatch(code, lang, mode) {
  const m = normalizeMode(mode);
  switch (lang) {
    case 'python': return compressPython(code, m);
    case 'javascript': case 'js': return compressJavaScript(code, 'javascript', m);
    case 'typescript': case 'ts': return compressJavaScript(code, 'typescript', m);
    case 'go': return compressGo(code, m);
    case 'rust': return compressRust(code, m);
    case 'java': return compressJava(code, m);
    case 'cpp': return compressCpp(code, 'cpp', m);
    case 'c': return compressCpp(code, 'c', m);
    case 'csharp': case 'cs': return compressCSharp(code, m);
    default: return compressJavaScript(code, 'javascript', m);
  }
}

/* ---------- tokens (match CLI fallback len/3.6) ---------- */
function estimateTokensFallback(text) {
  if (!text) return 0;
  return Math.max(1, Math.round(text.length / 3.6));
}


/* ---------- UI ---------- */
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btn-' + mode);
  if (btn) btn.classList.add('active');
  document.getElementById('outputTitle').innerText = 'Compressed (' + mode.charAt(0).toUpperCase() + mode.slice(1) + ')';
  processCode();
}
function onLangChange() {
  currentLangOverride = document.getElementById('langSelect').value;
  processCode();
}
function processCode() {
  const input = document.getElementById('inputCode').value;
  let compressed = '';
  let lang = 'auto';
  if (input.trim()) {
    lang = detectLanguage(input);
    try {
      compressed = compressDispatch(input, lang, currentMode);
    } catch (e) {
      compressed = '/* compression error: ' + (e && e.message) + ' */';
    }
  }
  document.getElementById('outputCode').value = compressed;
  document.getElementById('detectedLang').innerText = input.trim() ? lang + ' • ' + currentMode : '';
  const rawTok = estimateTokensFallback(input);
  const compTok = estimateTokensFallback(compressed);
  const savedTok = Math.max(0, rawTok - compTok);
  const pct = rawTok > 0 ? ((savedTok / rawTok) * 100).toFixed(1) : '0.0';
  document.getElementById('rawMeta').innerText = '~' + rawTok.toLocaleString() + ' tokens';
  document.getElementById('statRawTokens').innerText = '~' + rawTok.toLocaleString();
  document.getElementById('statCompTokens').innerText = '~' + compTok.toLocaleString();
  document.getElementById('statSavedTokens').innerText = '~' + savedTok.toLocaleString();
  document.getElementById('statReduction').innerText = '~' + pct + '%';
}
function copyOutput() {
  const out = document.getElementById('outputCode');
  out.select();
  if (navigator.clipboard) navigator.clipboard.writeText(out.value);
  else document.execCommand('copy');
  const btn = document.getElementById('copyBtn');
  btn.innerText = 'Copied!';
  setTimeout(() => { btn.innerText = 'Copy'; }, 2000);
}
// expose for parity testing
window.CaveCodeWeb = { compressDispatch, detectLanguage, normalizeMode, estimateTokensFallback };
processCode();
</script>
